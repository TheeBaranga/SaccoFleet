<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% if reveal %}
    <div class="sign-in-password">
      {{ field }}
      <button type="button" data-password-toggle aria-controls="{{ field.id_for_label }}" hidden>Show</button>
    </div>
  {% else %}
    {{ field }}
  {% endif %}
  {% if field.errors %}
    <div class="field-error" id="{{ field.auto_id }}_error" role="alert">{{ field.errors }}</div>
  {% endif %}
</div>
