{% load humanize %}<section class="table-panel chart-panel" aria-labelledby="cash-flow-heading"><div class="panel-heading"><div><h2 id="cash-flow-heading">Cash flow</h2><p class="subtitle">Collections and expenses over the last 7 days</p></div><span class="period-label">Last 7 days</span></div><div class="flow-chart"><div class="flow-columns">{% for day in chart %}<div class="flow-day"><div class="flow-bars"><svg viewBox="0 0 60 100" preserveAspectRatio="none" role="img" aria-label="{{ day.day|date:'j M' }}: collected KSh {{ day.collected }}, spent KSh {{ day.spent }}"><rect class="bar-in" x="9" y="0" width="18" height="{{ day.collected_pct }}" rx="3" transform="translate(0 100) scale(1 -1)"/><rect class="bar-out" x="33" y="0" width="18" height="{{ day.spent_pct }}" rx="3" transform="translate(0 100) scale(1 -1)"/></svg></div><span>{{ day.day|date:'D' }}</span><small>KSh {{ day.collected|intcomma }}<br><span class="expense-value">KSh {{ day.spent|intcomma }}</span></small></div>{% endfor %}</div><p class="legend"><span class="key key-in"></span>Collections <span class="key key-out"></span>Expenses</p></div></section>
